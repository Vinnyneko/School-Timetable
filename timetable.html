<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My School Timetable</title>

  <style>
    :root {
      color-scheme: light;
      --page-bg: #f3f6fb;
      --text: #202938;
      --muted: #5e6878;
      --surface: #ffffff;
      --header-bg: #3159a5;
      --time-header-bg: #243f78;
      --row-header-bg: #edf2fa;
      --border: #dce3ed;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --button-bg: #ffffff;
      --button-border: #cbd5e1;
      --period-box-bg: #e5e7eb;
      --period-box-text: #374151;
      --lesson-highlight: #e5e7eb;
      --lesson-highlight-border: #94a3b8;
    }

    body.dark-mode {
      color-scheme: dark;
      --page-bg: #151923;
      --text: #e8edf6;
      --muted: #aab4c5;
      --surface: #202633;
      --header-bg: #334c78;
      --time-header-bg: #263a5d;
      --row-header-bg: #293242;
      --border: #3a4557;
      --input-bg: #202633;
      --input-border: #4a566a;
      --button-bg: #293242;
      --button-border: #4a566a;
      --period-box-bg: #3a414d;
      --period-box-text: #f1f5f9;
      --lesson-highlight: #3a414d;
      --lesson-highlight-border: #94a3b8;
    }

    body.custom-mode {
      color-scheme: light;
      --custom-color: #7c3aed;
      --page-bg: color-mix(in srgb, var(--custom-color) 8%, white);
      --text: color-mix(in srgb, var(--custom-color) 55%, #202938);
      --muted: color-mix(in srgb, var(--custom-color) 45%, #687386);
      --surface: color-mix(in srgb, var(--custom-color) 3%, white);
      --header-bg: color-mix(in srgb, var(--custom-color) 76%, white);
      --time-header-bg: color-mix(in srgb, var(--custom-color) 88%, #202938);
      --row-header-bg: color-mix(in srgb, var(--custom-color) 12%, white);
      --border: color-mix(in srgb, var(--custom-color) 28%, white);
      --input-bg: color-mix(in srgb, var(--custom-color) 3%, white);
      --input-border: color-mix(in srgb, var(--custom-color) 24%, white);
      --button-bg: var(--surface);
      --button-border: var(--border);
      --period-box-bg: color-mix(in srgb, var(--custom-color) 12%, white);
      --period-box-text: var(--text);
      --lesson-highlight: color-mix(in srgb, var(--custom-color) 20%, white);
      --lesson-highlight-border: var(--custom-color);
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--page-bg);
      transition: color 0.25s ease, background-color 0.25s ease;
    }

    .pattern-background {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      color: var(--pattern-color, #7c3aed);
    }

    .pattern-background span {
      position: absolute;
      left: var(--left);
      top: var(--top);
      color: currentColor;
      opacity: 0.2;
      font-size: var(--size);
      animation: pattern-float var(--duration) ease-in-out var(--delay) infinite alternate;
    }

    .pattern-background img {
      position: absolute;
      height: auto;
      object-fit: contain;
      animation: pattern-float var(--duration) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes pattern-float {
      from { transform: translateY(-10px) rotate(-12deg); }
      to { transform: translateY(12px) rotate(12deg); }
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      cursor: pointer;
    }

    h1:focus-visible {
      outline: 2px solid #7199eb;
      outline-offset: 4px;
    }

    .title-options,
    .week-controls {
      display: flex;
      width: fit-content;
      max-width: 100%;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 8px auto;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .title-options[hidden] {
      display: none;
    }

    .title-options label,
    .week-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      padding: 8px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      background: var(--input-bg);
      cursor: pointer;
    }

    .hint {
      margin: 10px 0 14px;
      color: var(--muted);
      text-align: center;
    }

    .viewing-bar {
      position: relative;
      z-index: 5;
      max-width: 1200px;
      margin: 16px auto 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .viewing-heading {
      margin: 0;
      font-size: 1.25rem;
      text-align: left;
    }

    .date-and-theme {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .current-date {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: right;
    }

    .appearance-picker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .appearance-button,
    .pattern-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 6px;
      border: 1px solid var(--button-border);
      border-radius: 50%;
      color: var(--text);
      background: var(--button-bg);
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .appearance-button:hover,
    .pattern-button:hover {
      transform: scale(1.08);
    }

    .appearance-button:focus-visible,
    .pattern-button:focus-visible {
      outline: 2px solid #7199eb;
      outline-offset: 3px;
    }

    .appearance-menu,
    .pattern-menu {
      position: absolute;
      z-index: 20;
      right: 0;
      display: grid;
      min-width: 175px;
      max-height: 70vh;
      overflow-y: auto;
      gap: 5px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px #22324a26;
    }

    .appearance-menu { top: 48px; }
    .pattern-menu { top: 96px; }

    .appearance-menu[hidden],
    .pattern-menu[hidden],
    .custom-color-control[hidden] {
      display: none;
    }

    .appearance-menu button,
    .pattern-menu button {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      text-align: left;
      background: transparent;
      cursor: pointer;
    }

    .appearance-menu button:hover,
    .appearance-menu button[aria-pressed="true"],
    .pattern-menu button:hover,
    .pattern-menu button[aria-pressed="true"] {
      background: var(--row-header-bg);
    }

    .custom-color-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .custom-color-control input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .custom-pattern-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: var(--text);
      font: inherit;
    }

    .custom-pattern-control[hidden] {
      display: none;
    }

    .custom-pattern-control input {
      width: 180px;
      max-width: 100%;
      color: var(--text);
      font: inherit;
    }

    .current-period {
      width: fit-content;
      max-width: 1200px;
      margin: 0 auto 10px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--period-box-text);
      background: var(--period-box-bg);
      font-weight: 600;
      text-align: center;
    }

    td.current-lesson {
      background: var(--lesson-highlight);
      box-shadow: inset 0 0 0 3px var(--lesson-highlight-border);
    }

    .table-wrap {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 4px 18px #1b2b4518;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }

    thead th {
      color: white;
      background: var(--header-bg);
    }

    thead th:first-child {
      min-width: 145px;
      background: var(--time-header-bg);
    }

    tbody th {
      width: 145px;
      background: var(--row-header-bg);
      font-weight: 600;
    }

    .time {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85em;
      font-weight: normal;
    }

    input[type="text"] {
      width: 100%;
      min-height: 42px;
      padding: 8px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      text-align: center;
      background: var(--input-bg);
    }

    input[type="text"]:focus {
      outline: 2px solid #7199eb;
      border-color: transparent;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9em;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }

      .title-options,
      .week-controls {
        width: 100%;
        justify-content: center;
      }

      .viewing-bar { margin-top: 12px; }
    }

    @media (max-width: 450px) {
      .title-options,
      .week-controls {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .viewing-bar { align-items: flex-start; }
      .current-date { font-size: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pattern-background span,
      .pattern-background img {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="patternBackground" class="pattern-background" aria-hidden="true"></div>

  <h1 id="pageTitle" role="button" tabindex="0" aria-expanded="false">
    Year 9 Term 3 Timetable
  </h1>

  <div class="title-options" id="titleOptions" hidden>
    <label>
      Year
      <select id="yearSelect">
        <option>Year 7</option>
        <option>Year 8</option>
        <option selected>Year 9</option>
        <option>Year 10</option>
        <option>Year 11</option>
        <option>Year 12</option>
      </select>
    </label>

    <label>
      Term
      <select id="termSelect">
        <option>Term 1</option>
        <option>Term 2</option>
        <option selected>Term 3</option>
        <option>Term 4</option>
      </select>
    </label>
  </div>

  <div class="week-controls">
    <label for="weekSelect">Timetable to view and edit:</label>
    <select id="weekSelect">
      <option value="A">Week A</option>
      <option value="B">Week B</option>
    </select>
  </div>

  <p class="hint">
    Click a lesson box to add or change a lesson. Changes save automatically.
  </p>

  <div class="viewing-bar">
    <h2 class="viewing-heading" id="viewingHeading">Week A Timetable</h2>

    <div class="date-and-theme">
      <div class="appearance-picker">
        <button
          id="appearanceButton"
          class="appearance-button"
          type="button"
          aria-label="Choose timetable appearance"
          aria-expanded="false"
          aria-controls="appearanceMenu"
          title="Choose appearance"
        >🖌️</button>

        <div id="appearanceMenu" class="appearance-menu" hidden>
          <button type="button" data-theme="light">☀️ Light</button>
          <button type="button" data-theme="dark">🌙 Dark</button>
          <button type="button" data-theme="custom">🎨 Custom colour</button>
          <label id="customColorControl" class="custom-color-control" hidden>
            Choose colour
            <input id="customColorInput" type="color" value="#7c3aed">
          </label>
        </div>

        <button
          id="patternButton"
          class="pattern-button"
          type="button"
          aria-label="Choose a background pattern"
          aria-expanded="false"
          aria-controls="patternMenu"
          title="Choose a background pattern"
        >✦</button>

        <div id="patternMenu" class="pattern-menu" hidden>
          <button type="button" data-pattern="none">No pattern</button>
          <button type="button" data-pattern="stars">★ Stars</button>
          <button type="button" data-pattern="hearts">♥ Hearts</button>
          <button type="button" data-pattern="dots">● Polka dots</button>
          <button type="button" data-pattern="sparkles">✦ Sparkles</button>
          <button type="button" data-pattern="flowers">✿ Flowers</button>
          <button type="button" data-pattern="paws">🐾 Paw prints</button>
          <button type="button" data-pattern="moons">☾ Moons</button>
          <button type="button" data-pattern="clouds">☁ Clouds</button>
          <button type="button" data-pattern="catface">Kitty Face :3</button>
          <button type="button" data-pattern="music">♪ Music notes</button>
          <button type="button" data-pattern="diamonds">◆ Diamonds</button>
          <button type="button" data-pattern="custom">🖼️ Custom pattern</button>

          <label id="customPatternControl" class="custom-pattern-control" hidden>
            Choose image
            <input id="customPatternInput" type="file" accept="image/*">
          </label>
        </div>
      </div>

      <div id="currentDate" class="current-date"></div>
    </div>
  </div>

  <div id="currentPeriod" class="current-period" aria-live="polite"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
        </tr>
      </thead>
      <tbody id="timetable"></tbody>
    </table>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <script>
    document.getElementById("currentDate").textContent =
      new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(new Date());

    const appearanceButton = document.getElementById("appearanceButton");
    const appearanceMenu = document.getElementById("appearanceMenu");
    const appearanceOptions = appearanceMenu.querySelectorAll("[data-theme]");
    const customColorControl = document.getElementById("customColorControl");
    const customColorInput = document.getElementById("customColorInput");

    const patternButton = document.getElementById("patternButton");
    const patternMenu = document.getElementById("patternMenu");
    const patternBackground = document.getElementById("patternBackground");
    const patternOptions = patternMenu.querySelectorAll("[data-pattern]");
    const customPatternControl = document.getElementById("customPatternControl");
    const customPatternInput = document.getElementById("customPatternInput");

    let customPatternUrl = null;

    const savedColor = localStorage.getItem("timetableCustomColor");
    if (savedColor) customColorInput.value = savedColor;

    function updatePatternColor() {
      const isDark = document.body.classList.contains("dark-mode");

      const customColor = getComputedStyle(document.body)
        .getPropertyValue("--custom-color")
        .trim();

      const themeColor = getComputedStyle(document.body)
        .getPropertyValue("--header-bg")
        .trim();

      patternBackground.style.setProperty(
        "--pattern-color",
        isDark ? "#ffffff" : (customColor || themeColor || "#7c3aed")
      );
    }

    function setPattern(pattern) {
      patternBackground.replaceChildren();
      customPatternControl.hidden = pattern !== "custom";

      const symbols = {
        stars: "★",
        hearts: "♥",
        dots: "●",
        sparkles: "✦",
        flowers: "✿",
        paws: "🐾",
        moons: "☾",
        clouds: "☁",
        catface: ":3",
        music: "♪",
        diamonds: "◆"
      };

      if (pattern === "custom" && customPatternUrl) {
        for (let i = 0; i < 30; i++) {
          const image = document.createElement("img");
          image.src = customPatternUrl;
          image.alt = "";
          image.style.left = `${Math.random() * 94}%`;
          image.style.top = `${Math.random() * 90}%`;
          image.style.width = `${40 + Math.random() * 50}px`;
          image.style.opacity = "0.3";
          image.style.setProperty("--duration", `${3 + Math.random() * 5}s`);
          image.style.setProperty("--delay", `${-Math.random() * 5}s`);
          patternBackground.appendChild(image);
        }
      } else if (symbols[pattern]) {
        updatePatternColor();

        const count = pattern === "dots" ? 50 : 40;
        const biggerPattern = ["dots", "moons", "music"].includes(pattern);

        for (let i = 0; i < count; i++) {
          const decoration = document.createElement("span");
          decoration.textContent = symbols[pattern];
          decoration.style.setProperty("--left", `${Math.random() * 96}%`);
          decoration.style.setProperty("--top", `${Math.random() * 94}%`);
          decoration.style.setProperty(
            "--size",
            pattern === "dots"
              ? `${14 + Math.random() * 12}px`
              : biggerPattern
                ? `${28 + Math.random() * 24}px`
                : `${16 + Math.random() * 20}px`
          );
          decoration.style.setProperty("--duration", `${3 + Math.random() * 5}s`);
          decoration.style.setProperty("--delay", `${-Math.random() * 5}s`);
          patternBackground.appendChild(decoration);
        }
      }

      localStorage.setItem("timetablePattern", pattern);

      patternOptions.forEach((option) => {
        option.setAttribute(
          "aria-pressed",
          String(option.dataset.pattern === pattern)
        );
      });
    }

    function setAppearance(theme) {
      document.body.classList.remove("dark-mode", "custom-mode");
      customColorControl.hidden = theme !== "custom";

      if (theme === "dark") {
        document.body.classList.add("dark-mode");
        document.body.style.removeProperty("--custom-color");
      } else if (theme === "custom") {
        document.body.classList.add("custom-mode");
        document.body.style.setProperty("--custom-color", customColorInput.value);
      } else {
        document.body.style.removeProperty("--custom-color");
      }

      localStorage.setItem("timetableAppearance", theme);

      appearanceOptions.forEach((option) => {
        option.setAttribute(
          "aria-pressed",
          String(option.dataset.theme === theme)
        );
      });

      updatePatternColor();
    }

    setAppearance(localStorage.getItem("timetableAppearance") || "light");
    setPattern(localStorage.getItem("timetablePattern") || "none");

    appearanceButton.addEventListener("click", () => {
      const isOpen = !appearanceMenu.hidden;
      appearanceMenu.hidden = isOpen;
      appearanceButton.setAttribute("aria-expanded", String(!isOpen));
    });

    appearanceOptions.forEach((option) => {
      option.addEventListener("click", () => {
        const theme = option.dataset.theme;
        setAppearance(theme);

        if (theme !== "custom") {
          appearanceMenu.hidden = true;
          appearanceButton.setAttribute("aria-expanded", "false");
        }
      });
    });

    customColorInput.addEventListener("input", () => {
      document.body.classList.add("custom-mode");
      document.body.classList.remove("dark-mode");
      document.body.style.setProperty("--custom-color", customColorInput.value);

      localStorage.setItem("timetableCustomColor", customColorInput.value);
      localStorage.setItem("timetableAppearance", "custom");

      appearanceOptions.forEach((option) => {
        option.setAttribute(
          "aria-pressed",
          String(option.dataset.theme === "custom")
        );
      });

      updatePatternColor();
    });

    customColorInput.addEventListener("change", () => {
      appearanceMenu.hidden = true;
      appearanceButton.setAttribute("aria-expanded", "false");
    });

    patternButton.addEventListener("click", () => {
      const isOpen = !patternMenu.hidden;
      patternMenu.hidden = isOpen;
      patternButton.setAttribute("aria-expanded", String(!isOpen));
    });

    patternOptions.forEach((option) => {
      option.addEventListener("click", () => {
        setPattern(option.dataset.pattern);

        if (option.dataset.pattern !== "custom" || customPatternUrl) {
          patternMenu.hidden = true;
          patternButton.setAttribute("aria-expanded", "false");
        }
      });
    });

    customPatternInput.addEventListener("change", () => {
      const file = customPatternInput.files[0];
      if (!file || !file.type.startsWith("image/")) return;

      if (customPatternUrl) {
        URL.revokeObjectURL(customPatternUrl);
      }

      customPatternUrl = URL.createObjectURL(file);
      setPattern("custom");
      patternMenu.hidden = true;
      patternButton.setAttribute("aria-expanded", "false");
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".appearance-picker")) {
        appearanceMenu.hidden = true;
        patternMenu.hidden = true;
        appearanceButton.setAttribute("aria-expanded", "false");
        patternButton.setAttribute("aria-expanded", "false");
      }
    });

    const periods = [
      { name: "PC", time: "8:31–8:46", start: "08:31", end: "08:46", editable: false },
      { name: "Period 1", time: "8:48–9:48", start: "08:48", end: "09:48" },
      { name: "Period 2", time: "9:50–10:50", start: "09:50", end: "10:50" },
      { name: "Lunch 1", time: "10:50–11:30", start: "10:50", end: "11:30", editable: false },
      { name: "Period 3", time: "11:32–12:32", start: "11:32", end: "12:32" },
      { name: "Period 4", time: "12:34–1:34", start: "12:34", end: "13:34" },
      { name: "Lunch 2", time: "1:34–1:54", start: "13:34", end: "13:54", editable: false },
      { name: "Period 5", time: "1:56–2:56", start: "13:56", end: "14:56" }
    ];

    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const lessonsStorageKey = "mySchoolTimetables";
    const titleStorageKey = "timetableTitle";
    const selectedWeekStorageKey = "selectedTimetableWeek";

    const timetableBody = document.getElementById("timetable");
    const currentPeriodElement = document.getElementById("currentPeriod");
    const status = document.getElementById("status");
    const weekSelect = document.getElementById("weekSelect");
    const viewingHeading = document.getElementById("viewingHeading");
    const title = document.getElementById("pageTitle");
    const titleOptions = document.getElementById("titleOptions");
    const yearSelect = document.getElementById("yearSelect");
    const termSelect = document.getElementById("termSelect");

    let allLessons = {};

    try {
      allLessons = JSON.parse(localStorage.getItem(lessonsStorageKey)) || {};
    } catch {
      allLessons = {};
    }

    const savedWeek = localStorage.getItem(selectedWeekStorageKey);
    if (savedWeek === "A" || savedWeek === "B") {
      weekSelect.value = savedWeek;
    }

    let savedTitle = {};
    try {
      savedTitle = JSON.parse(localStorage.getItem(titleStorageKey)) || {};
    } catch {
      savedTitle = {};
    }

    if (savedTitle.year) yearSelect.value = savedTitle.year;
    if (savedTitle.term) termSelect.value = savedTitle.term;

    function updateTitle() {
      title.textContent = `${yearSelect.value} ${termSelect.value} Timetable`;
      localStorage.setItem(titleStorageKey, JSON.stringify({
        year: yearSelect.value,
        term: termSelect.value
      }));
    }

    function toggleTitleOptions() {
      const willShow = titleOptions.hidden;
      titleOptions.hidden = !willShow;
      title.setAttribute("aria-expanded", String(willShow));
    }

    title.addEventListener("click", toggleTitleOptions);

    title.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleTitleOptions();
      }
    });

    function saveTitleAndCloseOptions() {
      updateTitle();
      titleOptions.hidden = true;
      title.setAttribute("aria-expanded", "false");
    }

    yearSelect.addEventListener("change", saveTitleAndCloseOptions);
    termSelect.addEventListener("change", saveTitleAndCloseOptions);

    function minutesFromTime(time) {
      const [hours, minutes] = time.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function drawTimetable() {
      const selectedWeek = weekSelect.value;
      viewingHeading.textContent = `Week ${selectedWeek} Timetable`;
      timetableBody.replaceChildren();

      const now = new Date();
      const todayIndex = now.getDay() - 1;
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      periods.forEach((period, periodIndex) => {
        const row = document.createElement("tr");
        const heading = document.createElement("th");

        heading.innerHTML =
          `${period.name}<span class="time">${period.time}</span>`;
        row.appendChild(heading);

        days.forEach((day, dayIndex) => {
          const cell = document.createElement("td");

          const isCurrentLesson =
            todayIndex === dayIndex &&
            period.editable !== false &&
            currentMinutes >= minutesFromTime(period.start) &&
            currentMinutes < minutesFromTime(period.end);

          if (isCurrentLesson) cell.classList.add("current-lesson");

          if (period.editable !== false) {
            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Add lesson";
            input.setAttribute(
              "aria-label",
              `Week ${selectedWeek}, ${day}, ${period.name}`
            );
            input.value =
              allLessons[selectedWeek]?.[day]?.[periodIndex] || "";

            input.addEventListener("input", () => {
              allLessons[selectedWeek] ||= {};
              allLessons[selectedWeek][day] ||= {};
              allLessons[selectedWeek][day][periodIndex] = input.value;

              try {
                localStorage.setItem(
                  lessonsStorageKey,
                  JSON.stringify(allLessons)
                );
                status.textContent =
                  `Week ${selectedWeek} saved on this device.`;
              } catch {
                status.textContent =
                  "Could not save. Check your browser storage settings.";
              }
            });

            cell.appendChild(input);
          }

          row.appendChild(cell);
        });

        timetableBody.appendChild(row);
      });
    }

    weekSelect.addEventListener("change", () => {
      localStorage.setItem(selectedWeekStorageKey, weekSelect.value);
      status.textContent = "";
      drawTimetable();
    });

    function updateCurrentPeriod() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const todayIndex = now.getDay() - 1;

      const activePeriod = periods.find((period) =>
        currentMinutes >= minutesFromTime(period.start) &&
        currentMinutes < minutesFromTime(period.end)
      );

      if (todayIndex < 0 || todayIndex >= days.length) {
        currentPeriodElement.textContent = "Current period: No school today";
      } else if (activePeriod) {
        currentPeriodElement.textContent =
          `Current period: ${activePeriod.name}`;
      } else if (currentMinutes < minutesFromTime("08:31")) {
        currentPeriodElement.textContent = "Current period: Before school";
      } else if (currentMinutes >= minutesFromTime("14:56")) {
        currentPeriodElement.textContent = "Current period: School finished";
      } else {
        currentPeriodElement.textContent = "Current period: Passing time";
      }

      drawTimetable();
    }

    updateTitle();
    updateCurrentPeriod();
    setInterval(updateCurrentPeriod, 15_000);
  </script>
</body>
</html>
